services:
  mariadb:
    container_name: mariadb
    networks:
      - inception
    build: ./requirements/mariadb
    image: mariadb:notlatest
    pull_policy: build
    env_file: .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb:/var/lib/mysql
    restart: always
    expose:
      - "3306"

  nginx:
    container_name: nginx
    networks:
      - inception
    depends_on:
      - wordpress
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx:notlatest
    pull_policy: build
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    restart: always
    ports:
      - "443:443"

  wordpress:
    container_name: wordpress
    networks:
      - inception
    depends_on:
      - mariadb
    build: ./requirements/wordpress
    image: wordpress:notlatest
    pull_policy: build
    env_file: .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress:/var/www/wordpress
    restart: always
    expose:
      - "9000"
    
  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    image: adminer:notlatest
    restart: always
    networks:
      - inception
    env_file:
      - .env

  static:
    container_name: static
